name: Deploy NoDDL release

on:
  schedule:
    - cron: "37 18 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v1.0.72; empty uses latest"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-noddl-release
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository != 'Ariestar/NoDDL'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_REPOSITORY: Ariestar/NoDDL
      REQUESTED_VERSION: ${{ inputs.version }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out deployment config
        uses: actions/checkout@v4

      - name: Resolve release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$REQUESTED_VERSION" ]]; then
            tag="$REQUESTED_VERSION"
          else
            tag=$(gh release view --repo "$UPSTREAM_REPOSITORY" --json tagName --jq .tagName)
          fi

          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid release tag: $tag"
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore deployment state
        id: state
        uses: actions/cache/restore@v4
        with:
          path: .nodd-release-state
          key: noddl-release-${{ steps.release.outputs.tag }}-${{ hashFiles('wrangler.toml') }}

      - name: Set up Node.js
        if: steps.state.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        if: steps.state.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 12.13.0

      - name: Download release package
        if: steps.state.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          package="NoDDL-worker-${{ steps.release.outputs.tag }}.tar.gz"
          mkdir -p "$RUNNER_TEMP/noddl-release"
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "$UPSTREAM_REPOSITORY" \
            --pattern "$package" \
            --dir "$RUNNER_TEMP/noddl-release"
          mkdir -p "$RUNNER_TEMP/noddl-worker"
          tar -xzf "$RUNNER_TEMP/noddl-release/$package" -C "$RUNNER_TEMP/noddl-worker"
          cp wrangler.toml "$RUNNER_TEMP/noddl-worker/wrangler.toml"

      - name: Install release dependencies
        if: steps.state.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/noddl-worker
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Deploy Worker
        if: steps.state.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/noddl-worker
        run: npx --yes wrangler deploy

      - name: Initialize secrets and migrations
        if: steps.state.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/noddl-worker
        run: |
          node scripts/ensure-sync-key.mjs
          npx --yes wrangler d1 migrations apply DB --remote

      - name: Mark deployment complete
        if: steps.state.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .nodd-release-state
          echo "${{ steps.release.outputs.tag }}" > .nodd-release-state/version

      - name: Save deployment state
        if: steps.state.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .nodd-release-state
          key: noddl-release-${{ steps.release.outputs.tag }}-${{ hashFiles('wrangler.toml') }}
