name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [deploy_to_cf_workers]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --allow-build esbuild

      - name: Deploy Worker and apply D1 migrations
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: pnpm deploy

      - name: Enable workers.dev and resolve Worker URL
        id: worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/nodd/subdomain"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"enabled":true}' \
            "$endpoint" >/dev/null
          status="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$endpoint")"
          enabled="$(jq --raw-output --exit-status '.result.enabled' <<<"$status")"
          subdomain="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            | jq --raw-output --exit-status '.result.subdomain')"
          test "$enabled" = true
          echo "base_url=https://nodd.${subdomain}.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Build self-hosted extension
        if: ${{ steps.worker.outputs.base_url != '' }}
        env:
          VITE_API_BASE_URL: ${{ steps.worker.outputs.base_url }}
        run: pnpm build:extension

      - name: Package self-hosted extension
        if: ${{ steps.worker.outputs.base_url != '' }}
        run: zip -r NoDDL-extension-self-hosted.zip extension

      - name: Upload self-hosted extension
        if: ${{ steps.worker.outputs.base_url != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: NoDDL-extension-self-hosted
          path: NoDDL-extension-self-hosted.zip
          if-no-files-found: error
