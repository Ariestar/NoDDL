name: Release Chrome extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --allow-build esbuild

      - name: Run tests
        run: pnpm test

      - name: Build extension
        run: pnpm build:extension

      - name: Read package version
        id: package
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: zip -r "NoDDL-extension-v${{ steps.package.outputs.version }}.zip" extension

      - name: Package Worker
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/noddl-worker"
          mkdir -p "$staging/src"
          cp src/worker.ts "$staging/src/worker.ts"
          cp -R src/core "$staging/src/core"
          cp -R migrations "$staging/migrations"
          mkdir -p "$staging/scripts"
          cp scripts/deploy-release.mjs "$staging/scripts/deploy-release.mjs"
          cp scripts/ensure-sync-key.mjs "$staging/scripts/ensure-sync-key.mjs"
          cp package.json pnpm-lock.yaml tsconfig.json "$staging/"
          tar -czf "NoDDL-worker-v${{ steps.package.outputs.version }}.tar.gz" -C "$staging" .

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.package.outputs.version }}
        run: |
          extension_artifact="NoDDL-extension-${TAG}.zip"
          worker_artifact="NoDDL-worker-${TAG}.tar.gz"
          worker_latest_artifact="NoDDL-worker-latest.tar.gz"
          cp "$worker_artifact" "$worker_latest_artifact"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$extension_artifact" "$worker_artifact" "$worker_latest_artifact" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$extension_artifact" "$worker_artifact" "$worker_latest_artifact" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$TAG"
          fi

      - name: Trigger self-hosted updates
        if: env.RELEASE_WEBHOOK_SECRET != ''
        env:
          RELEASE_WEBHOOK_SECRET: ${{ secrets.NODDL_RELEASE_WEBHOOK_SECRET }}
          RELEASE_TAG: v${{ steps.package.outputs.version }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://mail.sair-club.com/api/release-dispatch" \
            -H "Authorization: Bearer $RELEASE_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"tag\":\"$RELEASE_TAG\"}"
