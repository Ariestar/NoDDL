name: Release Chrome extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --allow-build esbuild

      - name: Run tests
        run: pnpm test

      - name: Build extension
        run: pnpm build:extension

      - name: Read package version
        id: package
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: zip -r "NoDDL-extension-v${{ steps.package.outputs.version }}.zip" extension

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.package.outputs.version }}
        run: |
          artifact="NoDDL-extension-${TAG}.zip"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$artifact" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$artifact" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$TAG"
          fi
