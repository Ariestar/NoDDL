name: Sync upstream

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository != 'Ariestar/NoDDL'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_REPOSITORY: https://github.com/Ariestar/NoDDL.git
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream changes
        shell: bash
        run: |
          set -euo pipefail

          if ! gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName --jq 'map(select(.headRefName | startswith("automation/sync-upstream-"))) | length' | grep -q '^0$'; then
            echo "An upstream sync PR is already open."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream main
          git fetch origin main

          upstream_sha=$(git rev-parse upstream/main)
          branch="automation/sync-upstream-${upstream_sha:0:12}"
          git checkout -b "$branch" origin/main

          if ! git merge --no-commit --no-ff -X ours upstream/main; then
            git merge --abort
            echo "::error::Upstream changes contain an unresolved merge conflict."
            exit 1
          fi

          git restore --source=origin/main -- wrangler.toml
          git add -A

          if git diff --cached --quiet; then
            git merge --abort
            echo "Already up to date."
            exit 0
          fi

          git commit -m "chore: sync upstream ${upstream_sha:0:12}"
          git push origin "$branch"

          cat > "$RUNNER_TEMP/upstream-sync-pr.md" <<EOF
          This PR syncs the latest changes from [Ariestar/NoDDL](https://github.com/Ariestar/NoDDL) at commit \`${upstream_sha:0:12}\`.

          The user's \`wrangler.toml\` was preserved so Worker and D1 bindings remain attached to the user's own resources. Merging this PR triggers Cloudflare Workers Builds and the extension release workflow.
          EOF

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "chore: sync upstream NoDDL" \
            --body-file "$RUNNER_TEMP/upstream-sync-pr.md"
